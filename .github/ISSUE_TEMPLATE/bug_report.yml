name: Bug report
description: Something in the Aging WIP hub or widget is wrong or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please don't paste work item titles, names or other data you can't share publicly; describe them instead.
        Security issues: please don't open an issue, see [SECURITY.md](https://github.com/tomaszzelezny/azure-devops/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Boards hub (Boards → Aging WIP)
        - Dashboard widget
        - Widget configuration
        - Installing or updating the extension
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Organization settings → Extensions → Aging WIP.
      placeholder: e.g. 1.1.3
  - type: dropdown
    id: host
    attributes:
      label: Azure DevOps
      options:
        - Azure DevOps Services (dev.azure.com)
        - Azure DevOps Server (on-premises)
  - type: input
    id: process
    attributes:
      label: Process
      description: Agile, Scrum, CMMI, Basic, or an inherited process (and which custom states it adds, if relevant).
  - type: input
    id: browser
    attributes:
      label: Browser and theme
      placeholder: e.g. Edge 130, dark theme
  - type: textarea
    id: details
    attributes:
      label: Screenshots, console errors, anything else
      description: Errors from the browser's developer console (F12) help a lot. Blur anything confidential in screenshots.
