name: Package

# Every run builds a new version: the first run of a version tags it (v1.1.3),
# later runs bump the patch number, commit it to the branch and tag it.
# Runs on every merge to main (public build) and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visibility:
        description: Marketplace visibility of the .vsix
        type: choice
        options: [public, private]
        default: public

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    # The workflow's own "Release vX.Y.Z" commit must not start another release.
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    env:
      VISIBILITY: ${{ inputs.visibility || 'public' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest tip of the branch, so a queued run sees the previous run's release commit.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pick the version
        id: version
        run: |
          current=$(node -p 'require("./vss-extension.json").version')
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            node scripts/bump-version.mjs patch
            npm install --package-lock-only --ignore-scripts
          fi
          echo "version=$(node -p 'require("./vss-extension.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm run package:public
        if: env.VISIBILITY == 'public'
      - run: npm run package
        if: env.VISIBILITY == 'private'
      - name: Commit and tag the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
      # A GitHub Release keeps the .vsix as a plain file (workflow artifacts are always zipped).
      - name: Publish the .vsix as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          [ "$VISIBILITY" = private ] && flags+=(--prerelease)
          gh release create "v$VERSION" out/*.vsix --title "v$VERSION ($VISIBILITY)" --generate-notes "${flags[@]}"
