name: Package

# Releases happen only when a PR bumps the version (npm run version:bump, plus
# release-notes/vX.Y.Z.md). A merge to main whose version is not tagged yet builds,
# tags and releases it; any other merge does nothing. A manual run releases the
# current version too, and fails if it is already tagged. The workflow never pushes
# commits: main only takes changes through pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visibility:
        description: Marketplace visibility of the .vsix
        type: choice
        options: [public, private]
        default: public

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    # Older workflow versions pushed their own "Release vX.Y.Z" commits; those never release.
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    env:
      VISIBILITY: ${{ inputs.visibility || 'public' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest tip of the branch, so a queued run sees what was merged after it was queued.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pick the version
        id: version
        run: |
          version=$(node -p 'require("./vss-extension.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::v$version is already released. Bump the version in a PR first (npm run version:bump)."
              exit 1
            fi
            echo "v$version is already released: no release for this merge."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run package:public
        if: steps.version.outputs.release == 'true' && env.VISIBILITY == 'public'
      - run: npm run package
        if: steps.version.outputs.release == 'true' && env.VISIBILITY == 'private'
      - name: Tag the version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      # A GitHub Release keeps the .vsix as a plain file (workflow artifacts are always zipped).
      - name: Publish the .vsix as a GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          [ "$VISIBILITY" = private ] && flags+=(--prerelease)
          # Hand-written notes (release-notes/vX.Y.Z.md) go first; GitHub appends the generated PR list.
          [ -f "release-notes/v$VERSION.md" ] && flags+=(--notes-file "release-notes/v$VERSION.md")
          gh release create "v$VERSION" out/*.vsix --title "v$VERSION ($VISIBILITY)" --generate-notes "${flags[@]}"
