name: Package

# Every run builds a new version: the first run of a version tags it (v1.1.3),
# later runs bump the patch number, commit it to the branch and tag it.
on:
  workflow_dispatch:
    inputs:
      visibility:
        description: Marketplace visibility of the .vsix
        type: choice
        options: [public, private]
        default: public

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pick the version
        id: version
        run: |
          current=$(node -p 'require("./vss-extension.json").version')
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            node scripts/bump-version.mjs patch
            npm install --package-lock-only --ignore-scripts
          fi
          echo "version=$(node -p 'require("./vss-extension.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm run package:public
        if: inputs.visibility == 'public'
      - run: npm run package
        if: inputs.visibility == 'private'
      - name: Commit and tag the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ inputs.visibility }}-${{ steps.version.outputs.version }}
          path: out/*.vsix
