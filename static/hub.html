<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aging WIP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hub">
    <h1>Aging WIP</h1>
    <p class="sub">Każda kropka to otwarty element w toku. Kropki blisko przekątnej nie ruszyły się od wejścia w obecny stan.</p>

    <div class="controls">
      <label class="field"><span>Zespół</span><select id="team"></select></label>
      <label class="field"><span>Linia ostrzegawcza</span>
        <select id="threshold">
          <option value="30">30 dni</option>
          <option value="90">90 dni</option>
          <option value="180">pół roku</option>
          <option value="365">rok</option>
          <option value="730">2 lata</option>
        </select>
      </label>
      <div class="field"><span>&nbsp;</span><button class="btn" id="refresh" type="button">↻ Odśwież</button></div>
    </div>
    <div class="controls">
      <div class="field"><span>Typy elementów</span><div class="chips" id="types"></div></div>
      <div class="field"><span>Stany</span><div class="chips" id="states"></div></div>
    </div>

    <p class="status" id="status">Ładowanie…</p>
    <section id="result" hidden>
      <div class="card">
        <div class="legend" id="legend"></div>
        <div class="chart" id="chart"></div>
        <p class="take" id="take"></p>
      </div>
      <details>
        <summary id="tableTitle">Najdłużej w obecnym stanie</summary>
        <div class="tbl" id="table"></div>
      </details>
    </section>
  </main>
  <script src="hub.js"></script>
</body>
</html>
