<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aging WIP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hub">
    <h1>Aging WIP</h1>
    <p class="sub">Each dot is an open work item in progress. Dots near the diagonal have not changed state since work started.</p>

    <div class="controls">
      <label class="field"><span>Team</span><select id="team"></select></label>
      <label class="field"><span>Threshold line</span>
        <select id="threshold">
          <option value="30">30 days</option>
          <option value="90">90 days</option>
          <option value="180">6 months</option>
          <option value="365">1 year</option>
          <option value="730">2 years</option>
        </select>
      </label>
      <div class="field"><span>&nbsp;</span><button class="btn" id="refresh" type="button">↻ Refresh</button></div>
    </div>
    <div class="controls">
      <div class="field"><span>Work item types</span><div class="chips" id="types"></div></div>
      <div class="field"><span>States</span><div class="chips" id="states"></div></div>
    </div>

    <p class="status" id="status">Loading…</p>
    <section id="result" hidden>
      <div class="card">
        <div class="legend" id="legend"></div>
        <div class="chart" id="chart"></div>
        <p class="take" id="take"></p>
      </div>
      <details>
        <summary id="tableTitle">Longest in current state</summary>
        <div class="tbl" id="table"></div>
      </details>
    </section>
  </main>
  <script src="hub.js"></script>
</body>
</html>
